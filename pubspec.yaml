name: aamar_captain
description: "Aamar Captain: the driver app for Aamar Bike."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  material_symbols_icons: ^4.2960.0
  # wall-clock source the ride simulation reads; fake-able in widget tests
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0D0E11"
  image: assets/launcher/splash_logo.png
  image_dark: assets/launcher/splash_logo.png
  android_12:
    image: assets/launcher/splash_android12.png
    image_dark: assets/launcher/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#0D0E11"
  web: false
